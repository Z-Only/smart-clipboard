name: Release

on:
  push:
    tags:
      - 'v*'

jobs:
  quality:
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Linux system dependencies for Tauri
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - name: Setup Rust stable
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt

      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: './src-tauri -> target'

      - name: Restore Vitest cache
        uses: actions/cache@v4
        with:
          path: node_modules/.vitest
          key: ${{ runner.os }}-vitest-${{ hashFiles('pnpm-lock.yaml') }}-${{ hashFiles('vite.config.ts', 'tests/**/*.ts', 'src/**/*.ts', 'src/**/*.vue') }}
          restore-keys: |
            ${{ runner.os }}-vitest-${{ hashFiles('pnpm-lock.yaml') }}-

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run full quality checks
        run: pnpm run check

      - name: Build frontend
        run: pnpm run build

  create-release:
    runs-on: ubuntu-latest
    needs: quality
    permissions:
      contents: write
    outputs:
      release_id: ${{ steps.create_release.outputs.id }}
    steps:
      - uses: actions/checkout@v4

      - name: Extract changelog for current tag
        id: changelog
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          BODY_FILE=$(mktemp)
          USE_GENERATED="false"

          extract_version_section() {
            local file="$1"
            awk -v ver="$VERSION" '
              /^## \[/ {
                if (found) exit
                if (index($0, "[" ver "]")) { found=1; next }
              }
              found { print }
            ' "$file"
          }

          EN_NOTES=$(extract_version_section "CHANGELOG.md")

          if [ -n "$EN_NOTES" ]; then
            echo "<!-- lang:en -->" > "$BODY_FILE"
            echo "$EN_NOTES" >> "$BODY_FILE"

            if [ -f "CHANGELOG.zh-CN.md" ]; then
              ZH_NOTES=$(extract_version_section "CHANGELOG.zh-CN.md")
              if [ -n "$ZH_NOTES" ]; then
                echo "" >> "$BODY_FILE"
                echo "<!-- lang:zh-CN -->" >> "$BODY_FILE"
                echo "$ZH_NOTES" >> "$BODY_FILE"
              fi
            fi
          else
            USE_GENERATED="true"
          fi

          echo "body_file=$BODY_FILE" >> "$GITHUB_OUTPUT"
          echo "use_generated=$USE_GENERATED" >> "$GITHUB_OUTPUT"

      - name: Create Release
        id: create_release
        uses: softprops/action-gh-release@v2
        with:
          draft: true
          body_path: ${{ steps.changelog.outputs.use_generated == 'false' && steps.changelog.outputs.body_file || '' }}
          generate_release_notes: ${{ steps.changelog.outputs.use_generated == 'true' }}

  build-tauri:
    needs: [quality, create-release]
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: macos-latest
            args: --target aarch64-apple-darwin
            target: aarch64-apple-darwin
          - platform: macos-latest
            args: --target x86_64-apple-darwin
            target: x86_64-apple-darwin
          - platform: ubuntu-22.04
            args: ''
            target: ''
          - platform: windows-latest
            args: ''
            target: ''

    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@v4

      - name: Install dependencies (Ubuntu only)
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - name: Install frontend dependencies
        run: pnpm install --frozen-lockfile

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: './src-tauri -> target'

      - name: Validate updater signing secrets
        shell: bash
        run: |
          test -n "${TAURI_SIGNING_PRIVATE_KEY}"
          test -n "${TAURI_SIGNING_PRIVATE_KEY_PASSWORD}"
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}

      - name: Build Tauri app and upload updater artifacts
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          releaseId: ${{ needs.create-release.outputs.release_id }}
          args: ${{ matrix.args }}

  publish-release:
    runs-on: ubuntu-latest
    needs: [create-release, build-tauri]
    permissions:
      contents: write
    steps:
      - name: Publish release
        uses: actions/github-script@v7
        with:
          script: |
            await github.rest.repos.updateRelease({
              owner: context.repo.owner,
              repo: context.repo.repo,
              release_id: ${{ needs.create-release.outputs.release_id }},
              draft: false,
            });

      - name: Verify updater release assets expectation
        run: |
          echo "Expect latest.json plus platform updater artifacts/signatures to be attached by tauri-action"
          echo "latest.json"
